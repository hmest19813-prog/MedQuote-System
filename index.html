<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedQuote Pro — مؤسسة الحياة العلمية الطبية الكيماوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
// تهيئة Babel قبل تحميله لتسريع الـ transform
window.BABEL_OPTIONS = { presets: ['react'], sourceMaps: false };
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --primary: #2B8FC4;
  --primary-dark: #1C6A99;
  --primary-light: #EBF5FB;
  --primary-gold: #3FA3D8;
  --success: #057a55;
  --success-light: #def7ec;
  --warning: #c27803;
  --warning-light: #fef3c7;
  --danger: #c81e1e;
  --danger-light: #fde8e8;
  --info: #0694a2;
  --info-light: #e0f7fa;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-400: #9ca3af;
  --gray-500: #6b7280;
  --gray-600: #4b5563;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --gray-900: #111827;
  --sidebar-bg: #0d1e2e;
  --sidebar-width: 240px;
  --topbar-h: 60px;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans Arabic', sans-serif; background: var(--gray-50); color: var(--gray-800); font-size: 14px; }
button { cursor: pointer; font-family: inherit; }
input, select, textarea { font-family: inherit; }
a { text-decoration: none; color: inherit; }

/* ===================== AUTH PAGE ===================== */
.auth-bg {
  min-height: 100vh;
  background: linear-gradient(135deg, #0d1e2e 0%, #0f3460 50%, #0d1e2e 100%);
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.auth-bg::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(43,143,196,.25), transparent);
}
.auth-card {
  background: rgba(255,255,255,.97);
  border-radius: 20px;
  padding: 44px 40px;
  width: 420px; max-width: 95vw;
  box-shadow: 0 25px 60px rgba(0,0,0,.5);
  position: relative; z-index: 1;
}
.auth-logo { text-align: center; margin-bottom: 28px; }
.auth-logo img.logo-img {
  width: 110px; height: 110px; object-fit: contain;
  margin-bottom: 12px;
  filter: drop-shadow(0 4px 8px rgba(43,143,196,.3));
}
.auth-logo h1 { font-size: 18px; font-weight: 800; color: var(--gray-900); line-height: 1.4; }
.auth-logo h2 { font-size: 12px; font-weight: 500; color: var(--primary); margin-top: 3px; direction: ltr; }
.auth-logo p { font-size: 11px; color: var(--gray-500); margin-top: 2px; }
.auth-form-group { margin-bottom: 16px; }
.auth-form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--gray-700); margin-bottom: 6px; }
.auth-form-group input {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--gray-200); border-radius: 8px;
  font-size: 14px; transition: border .2s, box-shadow .2s;
  outline: none; background: var(--gray-50);
}
.auth-form-group input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(43,143,196,.12);
  background: white;
}
.auth-btn {
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, #2B8FC4, #3FA3D8);
  color: white; border: none; border-radius: 10px;
  font-size: 15px; font-weight: 700;
  box-shadow: 0 4px 15px rgba(43,143,196,.4);
  transition: transform .15s, box-shadow .15s;
  margin-top: 8px;
}
.auth-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(43,143,196,.55); }
.auth-btn:disabled { opacity: .6; transform: none; }
.auth-error {
  background: var(--danger-light); color: var(--danger);
  border: 1px solid #fca5a5; border-radius: 8px;
  padding: 10px 14px; font-size: 13px; margin-bottom: 14px; text-align: center;
}
.auth-footer { text-align: center; margin-top: 24px; color: var(--gray-400); font-size: 11px; line-height: 1.8; }

/* ===================== LAYOUT ===================== */
.app-layout { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-width); background: var(--sidebar-bg);
  position: fixed; top: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; z-index: 100; overflow-y: auto;
}
.sidebar-brand {
  padding: 16px; border-bottom: 1px solid rgba(255,255,255,.08);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-brand-logo {
  width: 44px; height: 44px; object-fit: contain; flex-shrink: 0;
  filter: none;
}
.sidebar-brand-text {}
.sidebar-brand-name { font-size: 12px; font-weight: 700; color: white; line-height: 1.4; }
.sidebar-brand-sub { font-size: 9px; color: rgba(255,255,255,.35); margin-top: 1px; direction: ltr; }
.sidebar-section { padding: 16px 8px 6px; }
.sidebar-section-label { font-size: 10px; color: rgba(255,255,255,.3); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 0 8px; margin-bottom: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 10px; border-radius: 8px;
  color: rgba(255,255,255,.55); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all .15s; margin-bottom: 1px;
}
.nav-item:hover { background: rgba(255,255,255,.07); color: rgba(255,255,255,.85); }
.nav-item.active { background: linear-gradient(135deg, #2B8FC4, #3FA3D8); color: white; box-shadow: 0 4px 12px rgba(43,143,196,.4); }
.sidebar-footer { margin-top: auto; padding: 14px; border-top: 1px solid rgba(255,255,255,.08); }
.user-card { display: flex; align-items: center; gap: 9px; padding: 9px; border-radius: 8px; background: rgba(255,255,255,.06); }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #2B8FC4, #3FA3D8); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; flex-shrink: 0; }
.user-name { font-size: 12px; font-weight: 600; color: white; }
.user-role { font-size: 10px; color: rgba(255,255,255,.4); }
.logout-btn { width: 100%; margin-top: 8px; padding: 7px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); color: rgba(255,255,255,.5); border-radius: 7px; font-size: 12px; transition: all .15s; }
.logout-btn:hover { background: rgba(220,38,38,.15); color: #fca5a5; border-color: rgba(220,38,38,.3); }

/* ===================== MAIN ===================== */
.main { margin-right: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.topbar { height: var(--topbar-h); background: white; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 50; }
.topbar-title { font-size: 17px; font-weight: 700; color: var(--gray-800); }
.content { padding: 24px; flex: 1; }

/* ===================== CARDS ===================== */
.card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--gray-100); }
.card-header { padding: 14px 18px; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 14px; font-weight: 700; color: var(--gray-800); }
.card-body { padding: 18px; }

/* ===================== STAT CARDS ===================== */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
.stat-card { background: white; border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--gray-100); border-right: 4px solid var(--primary); }
.stat-card.green { border-right-color: var(--success); }
.stat-card.orange { border-right-color: var(--warning); }
.stat-card.red { border-right-color: var(--danger); }
.stat-card.teal { border-right-color: var(--info); }
.stat-label { font-size: 10px; color: var(--gray-500); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
.stat-value { font-size: 24px; font-weight: 800; color: var(--gray-900); }
.stat-sub { font-size: 11px; color: var(--gray-400); margin-top: 3px; }

/* ===================== BUTTONS ===================== */
.btn { padding: 7px 14px; border-radius: 7px; border: none; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: all .15s; cursor: pointer; }
.btn-primary { background: linear-gradient(135deg, #2B8FC4, #3FA3D8); color: white; box-shadow: 0 2px 8px rgba(43,143,196,.3); }
.btn-primary:hover { box-shadow: 0 4px 12px rgba(43,143,196,.45); transform: translateY(-1px); }
.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-purple { background: #7c3aed; color: white; }
.btn-ghost { background: transparent; color: var(--gray-600); border: 1px solid var(--gray-200); }
.btn-ghost:hover { background: var(--gray-50); }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ===================== TABLE ===================== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { background: var(--gray-50); padding: 9px 12px; text-align: right; font-size: 11px; font-weight: 700; color: var(--gray-500); letter-spacing: .04em; text-transform: uppercase; border-bottom: 1px solid var(--gray-200); }
td { padding: 11px 12px; border-bottom: 1px solid var(--gray-100); font-size: 13px; color: var(--gray-700); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--gray-50); }

/* ===================== BADGES ===================== */
.badge { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge-draft { background: var(--gray-100); color: var(--gray-600); }
.badge-sent { background: var(--info-light); color: var(--info); }
.badge-approved { background: var(--success-light); color: var(--success); }
.badge-rejected { background: var(--danger-light); color: var(--danger); }
.badge-converted { background: #ede9fe; color: #7c3aed; }
.badge-invoiced { background: #fef3c7; color: #92400e; }
.badge-pending { background: var(--warning-light); color: var(--warning); }
.badge-confirmed { background: var(--info-light); color: var(--info); }
.badge-processing { background: #ede9fe; color: #7c3aed; }
.badge-delivered { background: var(--success-light); color: var(--success); }
.badge-cancelled { background: var(--danger-light); color: var(--danger); }

/* ===================== FORMS ===================== */
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 11px; font-weight: 700; color: var(--gray-600); margin-bottom: 5px; }
.form-control { width: 100%; padding: 8px 11px; border: 1.5px solid var(--gray-200); border-radius: 7px; font-size: 13px; outline: none; transition: border .15s; background: white; color: var(--gray-800); }
.form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(43,143,196,.1); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* ===================== MODAL ===================== */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: white; border-radius: 14px; width: 100%; max-width: 760px; max-height: 92vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
.modal-header { padding: 18px 22px; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: white; z-index: 10; }
.modal-title { font-size: 15px; font-weight: 700; }
.modal-close { background: none; border: none; font-size: 20px; color: var(--gray-400); padding: 4px; border-radius: 6px; cursor: pointer; }
.modal-close:hover { background: var(--gray-100); }
.modal-body { padding: 22px; }
.modal-footer { padding: 14px 22px; border-top: 1px solid var(--gray-100); display: flex; justify-content: flex-end; gap: 10px; position: sticky; bottom: 0; background: white; }

/* ===================== ITEMS TABLE IN FORM ===================== */
.items-table th, .items-table td { padding: 6px 8px; font-size: 12px; }
.items-table input, .items-table select { padding: 5px 7px; border: 1px solid var(--gray-200); border-radius: 5px; width: 100%; font-size: 12px; font-family: inherit; }

/* ===================== QUOTE/INVOICE PRINT ===================== */
.print-container { background: white; padding: 14px 36px 28px; max-width: 900px; margin: 0 auto; }
.print-header { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
.print-center { text-align: center; display: flex; justify-content: center; align-items: center; transform: translateX(-20px); }
.print-center .hayat-logo { width: 178px; height: 178px; object-fit: contain; display: block; margin: 0 auto; }
.print-header-names { display: none; }
.print-company-right { text-align: right; }
.print-company-right .co-name-ar { font-size: 21px; font-weight: 900; color: #111; line-height: 1.4; background: rgba(28,106,153,0.06); padding: 10px 16px; border-radius: 14px; display: inline-block; white-space: nowrap; }
.print-company-left { text-align: left; }
.print-company-left .co-name-hayat { font-size: 30px; font-weight: 900; color: var(--primary); letter-spacing: .06em; direction: ltr; line-height: 1.1; }
.print-company-left .co-name-en { font-size: 11px; font-weight: 700; color: #6B7A8B; letter-spacing: .07em; text-transform: uppercase; direction: ltr; }
.print-divider { border: none; border-top: 3px solid var(--primary); margin: 10px 0 14px; }
.print-doc-title { text-align: center; font-size: 22px; font-weight: 900; color: var(--primary); letter-spacing: .08em; margin-bottom: 10px; }
.print-quote-meta { display: flex; justify-content: center; gap: 48px; font-size: 12px; margin-bottom: 14px; padding: 7px 0; border-top: 1px solid #B8DCF0; border-bottom: 1px solid #B8DCF0; color: #555; }
.print-quote-meta strong { color: #111; font-size: 13px; }
.print-client-box { background: #F0F8FD; border: 1.5px solid #B8DCF0; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
.print-client-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; font-size: 12px; }
.print-client-grid .field-row { display: flex; flex-direction: row; align-items: baseline; gap: 8px; }
.print-client-grid label { color: #6B7A8B; font-weight: 700; font-size: 11px; min-width: 85px; flex-shrink: 0; }
.print-client-grid .field-row > *:not(label) { font-size: 13px; font-weight: 600; color: #111; }
.print-items { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: 11.5px; }
.print-items th { background: linear-gradient(135deg, #1C6A99, #2B8FC4); color: white; padding: 7px 9px; text-align: center; font-size: 11px; }
.print-items td { padding: 6px 9px; border-bottom: 1px solid #B8DCF0; text-align: center; vertical-align: middle; }
.print-items td.item-name { text-align: right; max-width: 150px; white-space: normal; word-break: break-word; line-height: 1.4; }
.print-items td.item-notes { max-width: 80px; white-space: normal; word-break: break-word; font-size: 10px; line-height: 1.4; }
.print-items tr:nth-child(even) td { background: #F0F8FD; }
.print-totals { display: flex; justify-content: flex-end; margin-bottom: 12px; }
.print-totals table { width: 300px; font-size: 12px; border: 1px solid #B8DCF0; border-radius: 8px; overflow: hidden; direction: ltr; }
.print-totals td:first-child { text-align: left; padding-left: 14px; }
.print-totals td:last-child { text-align: right; padding-right: 14px; font-weight: 700; }
.print-totals td { padding: 6px 12px; border-bottom: 1px solid #C5E2F5; }
.print-totals tr:last-child td { font-size: 15px; font-weight: 900; color: var(--primary); background: #F0F8FD; border-bottom: none; }
.print-notes { font-size: 11px; color: #666; border-top: 1px solid #B8DCF0; padding-top: 10px; margin-top: 4px; }
.print-stamp-area { display: flex; justify-content: flex-end; margin-top: 10px; }
.print-stamp { width: 110px; height: 110px; object-fit: contain; opacity: .85; }
.print-footer-bar { background: linear-gradient(135deg, #1C6A99, #2B8FC4); color: white; padding: 10px 20px; border-radius: 8px; margin-top: 18px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; font-size: 10px; }
.print-footer-right { text-align: right; line-height: 1.8; }
.print-footer-center { text-align: center; border-left: 1px solid rgba(255,255,255,.35); border-right: 1px solid rgba(255,255,255,.35); padding: 0 14px; line-height: 1.9; white-space: nowrap; }
.print-footer-left { text-align: left; direction: ltr; line-height: 1.8; }
.print-footer-label { font-size: 9px; opacity: .75; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 3px; }
.footer-contact-row { display: flex; gap: 0; direction: ltr; line-height: 1.9; }
.footer-contact-row .fc-label { width: 46px; opacity: .8; }
.footer-contact-row .fc-sep { margin: 0 4px; opacity: .6; }
.footer-contact-row .fc-value { letter-spacing: .02em; }

@media print {
  /* نخفي كل شيء - printDoc تتحكم بما يُطبع */
  body > *:not(#temp-print-div) { display: none !important; }
  
  #temp-print-div {
    display: block !important;
    position: static !important;
    width: 100% !important;
    background: white !important;
  }

  .no-print { display: none !important; }
  
  /* نحافظ على الألوان عند الطباعة */
  * { 
    -webkit-print-color-adjust: exact !important; 
    print-color-adjust: exact !important; 
    color-adjust: exact !important; 
  }
  
  body { margin: 0 !important; background: white !important; }
  
  @page { margin: 8mm; size: A4 portrait; }
}

/* ===================== CHARTS ===================== */
.chart-bar-wrap { display: flex; align-items: flex-end; gap: 8px; height: 90px; padding: 0 4px; }
.chart-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.chart-bar { width: 100%; background: linear-gradient(to top, #2B8FC4, #3FA3D8); border-radius: 4px 4px 0 0; min-height: 2px; }
.chart-bar-label { font-size: 10px; color: var(--gray-400); }
.donut-wrap { display: flex; align-items: center; gap: 14px; }
.donut-legend { display: flex; flex-direction: column; gap: 5px; }
.donut-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.donut-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* ===================== TOASTS ===================== */
.toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 11px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); min-width: 240px; animation: slideIn .2s ease; }
.toast-success { background: var(--success); color: white; }
.toast-error { background: var(--danger); color: white; }
.toast-info { background: var(--primary); color: white; }
@keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ===================== LOADING ===================== */
.loading-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--gray-50); flex-direction: column; gap: 16px; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===================== EMPTY STATE ===================== */
.empty-state { text-align: center; padding: 50px 20px; color: var(--gray-400); }
.empty-state p { font-size: 14px; font-weight: 600; color: var(--gray-500); }

/* ===================== ACTIVITY ===================== */
.activity-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--gray-100); }
.activity-item:last-child { border-bottom: none; }
.activity-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); margin-top: 5px; flex-shrink: 0; }
.activity-text { font-size: 13px; color: var(--gray-700); }
.activity-time { font-size: 11px; color: var(--gray-400); margin-top: 2px; }

/* ===================== FILTER BAR ===================== */
.filter-bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--gray-50); border-bottom: 1px solid var(--gray-100); flex-wrap: wrap; }
.search-input { padding: 7px 11px; border: 1.5px solid var(--gray-200); border-radius: 7px; font-size: 13px; outline: none; min-width: 200px; font-family: inherit; }
.search-input:focus { border-color: var(--primary); }

/* UTILS */
.text-muted { color: var(--gray-400); }
.text-sm { font-size: 12px; }
.font-bold { font-weight: 700; }
.flex { display: flex; }
.items-center { align-items: center; }
.gap-2 { gap: 8px; }
.mb-4 { margin-bottom: 16px; }
.mb-6 { margin-bottom: 24px; }

let toastSetter = null;
function Toasts() {
  const [list, setList] = useState([]);
  toastSetter = setList;
  useEffect(() => {
    if (list.length > 0) {
      const t = setTimeout(() => setList(l => l.slice(1)), 3200);
      return () => clearTimeout(t);
    }
  }, [list]);
  return <div className="toast-container">
    {list.map((t,i) => <div key={i} className={`toast toast-${t.type}`}>{t.msg}</div>)}
  </div>;
}

/* ===================== AUTH PAGE ===================== */
function AuthPage({ onLogin }) {
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    setLoading(true);
    // timeout 12 ثانية للحماية
    const timer = setTimeout(() => {
      setLoading(false);
      setError('انتهت مهلة الاتصال — تحقق من الإنترنت وحاول مجدداً');
    }, 12000);
    try {
      const { data, error: authErr } = await sb.auth.signInWithPassword({ email, password: pass });
      if (authErr) throw authErr;
      // جلب الـ profile مع timeout
      let profile = null;
      try {
        const res = await Promise.race([
          sb.from('profiles').select('*').eq('id', data.user.id).maybeSingle(),
          new Promise((_,r) => setTimeout(() => r(new Error('profile timeout')), 5000))
        ]);
        profile = res.data;
      } catch(pe) {
        console.warn('Profile fetch slow:', pe.message);
      }
      clearTimeout(timer);
      // نضمن أن id دايماً من auth
      const u = {
        id: data.user.id,
        email: data.user.email,
        ...(profile || {}),
        id: data.user.id,
      };
      onLogin(u);
    } catch (err) {
      clearTimeout(timer);
      const msg = err.message || '';
      if (msg.includes('Invalid login') || msg.includes('invalid_credentials')) setError('الإيميل أو كلمة المرور غير صحيحة');
      else if (msg.includes('Email not confirmed')) setError('يرجى تأكيد الإيميل أولاً');
      else if (msg.includes('fetch') || msg.includes('network') || msg.includes('timeout')) setError('تعذر الاتصال — تحقق من الإنترنت');
      else setError('خطأ: ' + msg);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="auth-bg">
      <div className="auth-card">
        <div className="auth-logo">
          <img src={LOGO_SRC} className="logo-img" alt="Hayat Logo"/>
          <h1>مؤسسة الحياة العلمية</h1>
          <h2>HAYAT scientific chemical medical corp.</h2>
          <p>نظام إدارة عروض الأسعار</p>
        </div>

        {error && <div className="auth-error">{error}</div>}

        <form onSubmit={handleSubmit}>
          <div className="auth-form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)}
              placeholder="user@hmest.com" required autoComplete="email"/>
          </div>
          <div className="auth-form-group">
            <label>كلمة المرور</label>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)}
              placeholder="••••••••" required autoComplete="current-password"/>
          </div>
          <button type="submit" className="auth-btn" disabled={loading}>
            {loading ? 'جاري تسجيل الدخول...' : 'تسجيل الدخول'}
          </button>
        </form>

        <div className="auth-footer">
          <p>نظام محمي — Supabase Auth + Row Level Security</p>
          <p>{COMPANY.website} | {COMPANY.email}</p>
        </div>
      </div>
    </div>
  );
}

function MiniChart({ data }) {

  return (
    <div className="chart-bar-wrap">
      {data.map((d,i) => (
        <div key={i} className="chart-bar-col">
          <div className="chart-bar" style={{ height: `${(d.v/max)*70}px` }}/>
          <span className="chart-bar-label">{d.l}</span>
        </div>
      ))}
    </div>
  );
}

function Donut({ items }) {
  const total = items.reduce((s,i) => s+i.v, 0) || 1;
  let off = 0;
  const r = 34, circ = 2*Math.PI*r;
  const colors = ['#2B8FC4','#057a55','#c27803','#c81e1e','#7c3aed'];
  return (
    <div className="donut-wrap">
      <svg width="86" height="86" viewBox="0 0 86 86">
        {items.map((item,i) => {
          const pct = item.v / total;
          const dash = pct * circ;
          const el = (
            <circle key={i} cx="43" cy="43" r={r}
              fill="none" stroke={colors[i%colors.length]}
              strokeWidth="12"
              strokeDasharray={`${dash} ${circ-dash}`}
              strokeDashoffset={-off}
              style={{ transform:'rotate(-90deg)', transformOrigin:'43px 43px' }}
            />
          );
          off += dash;
          return el;
        })}
        <text x="43" y="48" textAnchor="middle" fontSize="13" fontWeight="800" fill="#1f2937">{total}</text>
      </svg>
      <div className="donut-legend">
        {items.map((item,i) => (
          <div key={i} className="donut-legend-item">
            <div className="donut-dot" style={{background: colors[i%5]}}/>
            <span>{item.l}: <strong>{item.v}</strong></span>
          </div>
        ))}
      </div>
    </div>
  );
}

                ))}
                {active.length===0&&<tr><td colSpan="4" style={{textAlign:'center',color:'var(--gray-400)',padding:20}}>لا توجد عروض بعد</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title">آخر النشاطات</span></div>
          <div className="card-body">
            {logs.slice(0,6).map((l,i)=>(
              <div key={i} className="activity-item">
                <div className="activity-dot"/>
                <div><div className="activity-text">{l.action}</div><div className="activity-time">{l.user_name} — {ago(l.created_at)}</div></div>

            ))}
            {logs.length===0&&<p className="text-muted text-sm">لا توجد نشاطات</p>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ===================== QUOTE FORM (عرض + فاتورة) ===================== */
function QuoteForm({ user, quote: editQuote, mode='quote', onSave, onClose }) {
  const [form, setForm] = useState({
    customer_name:'', attention:'', phone:'', address:'',
    date: today(), reference:'', currency:'JOD',
    delivery:'PROMPT', notes:'', terms:'',
    discount_pct: 5, tax_pct: 16,
    ...(editQuote || {})
  });
  const [items, setItems] = useState([
    { item_name:'', description:'', unit:'EACH', quantity:1, unit_price:0, origin:'CHINA', delivery:'PROMPT', notes:'' }
  ]);
  const [loading, setLoading] = useState(false);
  const [loadingItems, setLoadingItems] = useState(!!editQuote);
  const [customers, setCustomers] = useState([]);

  useEffect(() => {
    sb.from('customers').select('id,name,phone').order('name').then(({data})=>setCustomers(data||[]));
  }, []);

  const applyCustomer = (custId) => {
    const c = customers.find(x=>x.id===custId);
    if (!c) { setF('customer_id',''); return; }
    setF('customer_id', c.id);
    if (!form.customer_name) setF('customer_name', c.name);
    if (!form.phone) setF('phone', c.phone||'');
  };

  useEffect(() => {
    if (editQuote?.id) {
      sb.from('quotation_items').select('*').eq('quotation_id', editQuote.id).order('sort_order')
        .then(({ data, error }) => {
          if (error) console.warn('Items error:', error.message);
          if (data?.length) setItems(data);
          setLoadingItems(false);
        })
        .catch(() => setLoadingItems(false));
      const t = setTimeout(() => setLoadingItems(false), 6000);
      return () => clearTimeout(t);
    }
  }, [editQuote]);

  const setF = (k,v) => setForm(f => ({ ...f, [k]: v }));

  const subtotal = items.reduce((s,i) => s + (parseFloat(i.quantity||0)*parseFloat(i.unit_price||0)), 0);
  const disc_pct = parseFloat(form.discount_pct||0);
  const disc_amt = subtotal * disc_pct / 100;
  const after_disc = subtotal - disc_amt;
  const tax_pct = parseFloat(form.tax_pct||0);
  const tax_amt = after_disc * tax_pct / 100;
  const nett = after_disc + tax_amt;

  const addItem = () => setItems(i => [...i, { item_name:'', description:'', unit:'EACH', quantity:1, unit_price:0, origin:'CHINA', delivery:'PROMPT', notes:'' }]);
  const removeItem = (idx) => setItems(i => i.filter((_,j)=>j!==idx));
  const setItem = (idx, k, v) => setItems(i => i.map((it,j) => j===idx ? {...it,[k]:v} : it));

  const handleSave = async (status='draft') => {
    if (!form.customer_name.trim()) { toast('يجب إدخال اسم العميل','error'); return; }
    if (items.every(i=>!i.item_name.trim())) { toast('أضف صنفاً واحداً على الأقل','error'); return; }
    setLoading(true);
    try {
      const payload = {
        ...form,
        subtotal: subtotal.toFixed(3),
        discount_amt: disc_amt.toFixed(3),
        tax_amt: tax_amt.toFixed(3),
        nett_price: nett.toFixed(3),
        status,
      };
      delete payload.id;
      delete payload.created_at;
      delete payload.updated_at;
      delete payload._convertToInvoice;
      delete payload.grand_total;
      delete payload.number;
      delete payload.total_price;
      if (!editQuote?.id) { payload.created_by = user?.id || null; }
      else { delete payload.created_by; }

      let qId;
      if (editQuote?.id) {
        const {error:e} = await sb.from('quotations').update(payload).eq('id', editQuote.id);
        if(e) throw e;
        qId = editQuote.id;
        await sb.from('quotation_items').delete().eq('quotation_id', qId);
      } else {
        const { data: q, error: qErr } = await sb.from('quotations').insert(payload).select().single();
        if (qErr) throw qErr;
        qId = q.id;
      }

      const itemRows = items.filter(i=>i.item_name.trim()).map((i,idx) => ({
        quotation_id: qId, sort_order: idx,
        item_name: i.item_name, description: i.description,
        unit: i.unit||'EACH', quantity: parseFloat(i.quantity)||1,
        unit_price: parseFloat(i.unit_price)||0,
        origin: i.origin||'CHINA', delivery: i.delivery||'PROMPT', notes: i.notes,
      }));
      const { error: iErr } = await sb.from('quotation_items').insert(itemRows);
      if (iErr) throw iErr;

      // activity log skipped

      toast(editQuote ? 'تم التعديل بنجاح' : 'تم الإنشاء بنجاح', 'success');
      onSave();
    } catch (err) {
      toast('خطأ: ' + err.message, 'error');
    } finally {
      setLoading(false);
    }
  };

  if (loadingItems) return <div className="modal-overlay"><div className="modal"><div style={{padding:40,textAlign:'center'}}><div className="spinner" style={{margin:'auto'}}/></div></div></div>;

  const modeLabel = mode==='invoice' ? 'الفاتورة' : 'عرض السعر';

  return (
    <div className="modal-overlay">
      <div className="modal" style={{maxWidth:950}}>
        <div className="modal-header">
          <span className="modal-title">{editQuote ? `تعديل ${modeLabel}` : `إنشاء ${modeLabel} جديد`}</span>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          {/* ربط بعميل موجود */}
          {customers.length > 0 && (
            <div style={{background:'var(--gray-50)',border:'1.5px solid var(--gray-200)',borderRadius:8,padding:'10px 14px',marginBottom:16}}>
              <div className="form-label" style={{marginBottom:6}}>ربط بعميل موجود (اختياري — يملأ الحقول تلقائياً)</div>
              <select className="form-control" value={form.customer_id||''} onChange={e=>applyCustomer(e.target.value)}>
                <option value="">— اختر عميلاً —</option>
                {customers.map(c=><option key={c.id} value={c.id}>{c.name}{c.phone?` — ${c.phone}`:''}</option>)}
              </select>
            </div>
          )}
          {/* بيانات العميل */}
          <div className="section-title">بيانات العميل</div>
          <div className="form-row mb-4">
            <div className="form-group">
              <label className="form-label">اسم العميل *</label>
              <input className="form-control" value={form.customer_name} onChange={e=>setF('customer_name',e.target.value)} placeholder="اسم الجهة / الشركة"/>
            </div>
            <div className="form-group">
              <label className="form-label">عناية</label>
              <input className="form-control" value={form.attention} onChange={e=>setF('attention',e.target.value)} placeholder="قسم المشتريات المحترمين"/>
            </div>
          </div>
          <div className="form-row-3 mb-4">
            <div className="form-group">
              <label className="form-label">هاتف</label>
              <input className="form-control" value={form.phone} onChange={e=>setF('phone',e.target.value)}/>
            </div>
            <div className="form-group">
              <label className="form-label">التاريخ</label>
              <input type="date" className="form-control" value={form.date} onChange={e=>setF('date',e.target.value)}/>
            </div>
            <div className="form-group">
              <label className="form-label">المرجع</label>
              <input className="form-control" value={form.reference} onChange={e=>setF('reference',e.target.value)} placeholder="دمى المحاكاة"/>
            </div>
          </div>
          <div className="form-row mb-4">
            <div className="form-group">
              <label className="form-label">العملة</label>
              <select className="form-control" value={form.currency} onChange={e=>setF('currency',e.target.value)}>
                <option>JOD</option><option>USD</option><option>EUR</option>
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">التوصيل</label>
              {(()=>{const std=['PROMPT','2-4 WEEKS','4-6 WEEKS','8-12 WEEKS'];const isCust=!std.includes(form.delivery);return(<><select className="form-control" value={isCust?'CUSTOM':form.delivery} onChange={e=>{if(e.target.value==='CUSTOM')setF('delivery','');else setF('delivery',e.target.value);}}><option>PROMPT</option><option>2-4 WEEKS</option><option>4-6 WEEKS</option><option>8-12 WEEKS</option><option value="CUSTOM">مخصص...</option></select>{isCust&&<input className="form-control" style={{marginTop:6}} value={form.delivery} onChange={e=>setF('delivery',e.target.value)} placeholder="أدخل مدة التوصيل"/>}</>);})()}
            </div>
          </div>

          {/* الأصناف */}
          <div className="section-title">الأصناف</div>
          <div className="table-wrap" style={{marginBottom:10}}>
            <table className="items-table">
              <thead>
                <tr>
                  <th style={{width:28}}>#</th>
                  <th style={{minWidth:150}}>المنتج</th>
                  <th style={{width:85}}>الوحدة</th>
                  <th style={{width:60}}>الكمية</th>
                  <th style={{width:85}}>سعر الوحدة</th>
                  <th style={{width:85}}>الإجمالي</th>

                  <th style={{width:85}}>التوصيل</th>

                      <td style={{fontWeight:700,color:'var(--primary)'}}>{tot}</td>
                      <td><input value={item.origin} onChange={e=>setItem(i,'origin',e.target.value)} placeholder="CHINA"/></td>

                      <td><button onClick={()=>removeItem(i)} style={{background:'none',border:'none',color:'var(--danger)',fontSize:16,cursor:'pointer'}}>×</button></td>
                    </tr>

        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose} disabled={loading}>إلغاء</button>
          <button className="btn btn-ghost" onClick={()=>handleSave('draft')} disabled={loading}>{loading?'...1':'حفظ كمسودة'}</button>
          <button className="btn btn-primary" onClick={()=>handleSave('sent')} disabled={loading}>{loading?'...':' حفظ وإرسال'}</button>
        </div>
      </div>
    </div>
  );
}

/* ===================== QUOTES LIST ===================== */
function QuotesList({ user, quotes, onReload }) {
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [profiles, setProfiles] = useState({});
  const [editing, setEditing] = useState(null);
  const [orderingQ, setOrderingQ] = useState(null);
  const [previewing, setPreviewQ] = useState(null);
  const [previewItems, setPreviewItems] = useState([]);
  const [showForm, setShowForm] = useState(false);

  const isAdmin = user?.role === 'admin' || user?.role === 'manager';

  useEffect(() => {
    sb.from('profiles').select('id,full_name').then(({data}) => {
      const map = {};
      (data||[]).forEach(p => { map[p.id] = p.full_name; });
      setProfiles(map);
    });
  }, []);

  const active = quotes.filter(q => !q.archived);
  const filtered = active.filter(q => {
    const ms = !search || q.customer_name?.toLowerCase().includes(search.toLowerCase()) || q.number?.includes(search);
    const mf = filter === 'all' || q.status === filter;
    const md = (!dateFrom || (q.date||'') >= dateFrom) && (!dateTo || (q.date||'') <= dateTo);
    return ms && mf && md;
  });

  const openPreview = async (q) => {
    const { data } = await sb.from('quotation_items').select('*').eq('quotation_id', q.id).order('sort_order');
    setPreviewItems(data||[]);
    setPreviewQ(q);
  };

  const changeStatus = async (q, newStatus) => {
    await sb.from('quotations').update({ status: newStatus }).eq('id', q.id);
    // log skipped
    toast('تم تغيير الحالة', 'success');
    onReload();
  };

  const archiveQ = async (q) => {
    if (!confirm('أرشفة هذا العرض؟')) return;
    await sb.from('quotations').update({ archived:true, archived_at:new Date().toISOString() }).eq('id', q.id);
    toast('تم الأرشفة', 'success'); onReload();
  };

  const deleteQ = async (q) => {
    if (!confirm('حذف نهائي؟')) return;
    await sb.from('quotations').delete().eq('id', q.id);
    toast('تم الحذف', 'success'); onReload();
  };

  const convertToOrder = async (q) => {
    if (!confirm('تحويل لطلب؟')) return;
    const { error } = await sb.from('orders').insert({ quotation_id:q.id, quotation_number:q.number, customer_name:q.customer_name, currency:q.currency, total_amount:q.nett_price, status:'pending', created_by: user?.id||null });
    if (error) { toast('خطأ: ' + error.message, 'error'); return; }
    await sb.from('quotations').update({ status:'converted' }).eq('id', q.id);
    toast('تم التحويل لطلب', 'success'); onReload();
  };

  const convertToInvoice = async (q) => {
    setEditing({ ...q, _convertToInvoice: true });
  };

  return (
    <div>
      <div className="flex items-center gap-2 mb-4" style={{justifyContent:'space-between'}}>
        <h2 style={{fontSize:20,fontWeight:800}}>عروض الأسعار</h2>
        <button className="btn btn-primary" onClick={()=>setShowForm(true)}>+ عرض جديد</button>
      </div>
      <div className="card">
        <div className="filter-bar">
          <input className="search-input" placeholder="بحث بالاسم أو الرقم..." value={search} onChange={e=>setSearch(e.target.value)}/>
          <select className="form-control" style={{width:'auto'}} value={filter} onChange={e=>setFilter(e.target.value)}>
            <option value="all">كل الحالات</option>
            {Object.entries(SL).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
          </select>
          <input type="date" className="form-control" style={{width:'auto'}} value={dateFrom} onChange={e=>setDateFrom(e.target.value)} title="من تاريخ"/>
          <input type="date" className="form-control" style={{width:'auto'}} value={dateTo} onChange={e=>setDateTo(e.target.value)} title="إلى تاريخ"/>
          {(dateFrom||dateTo) && <button className="btn btn-ghost btn-sm" onClick={()=>{setDateFrom('');setDateTo('');}}>✕ مسح التاريخ</button>}
          <span style={{color:'var(--gray-400)',fontSize:13,marginRight:'auto'}}>{filtered.length} عرض</span>
        </div>
        <div className="table-wrap">
          <table>
            <thead>
              <tr><th>الرقم</th><th>العميل</th><th>التاريخ</th><th>القيمة</th><th>الحالة</th>{isAdmin && <th>المُصدِر</th>}<th>تغيير الحالة</th><th>إجراءات</th></tr>
            </thead>
            <tbody>
              {filtered.map(q => (
                <tr key={q.id}>
                  <td className="font-bold" style={{color:'var(--primary)'}}>{q.number}</td>
                  <td>{q.customer_name}</td>
                  <td className="text-sm text-muted">{q.date}</td>
                  <td className="font-bold">{parseFloat(q.nett_price||0).toFixed(3)}</td>
                  <td><SBadge status={q.status}/></td>
                  {isAdmin && <td className="text-sm text-muted">{profiles[q.created_by] || '—'}</td>}
                  <td>
                    <select className="form-control" style={{fontSize:11,padding:'3px 7px',width:'auto'}}
                      value={q.status} onChange={e=>changeStatus(q,e.target.value)}>
                      {Object.entries(SL).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
                    </select>
                  </td>
                  <td>
                    <div className="flex gap-2">
                      <button className="btn btn-ghost btn-sm" onClick={()=>openPreview(q)} title="معاينة">👁</button>
                      <button className="btn btn-ghost btn-sm" onClick={()=>setEditing(q)} title="تعديل">✏️</button>
                      {q.status!=='invoiced' && (
                        <button className="btn btn-purple btn-sm" onClick={()=>convertToInvoice(q)} title="تحويل لفاتورة">🧾 فاتورة</button>
                      )}
                      {q.status!=='converted' && q.status!=='invoiced' && (
                        <button className="btn btn-success btn-sm" onClick={()=>setOrderingQ(q)}>📦 طلب</button>
                      )}
                      <button className="btn btn-ghost btn-sm" onClick={()=>archiveQ(q)} title="أرشفة">🗄️</button>
                      {user?.role==='admin' && <button className="btn btn-danger btn-sm" onClick={()=>deleteQ(q)}>🗑</button>}
                    </div>
                  </td>
                </tr>
              ))}
              {filtered.length===0 && <tr><td colSpan={isAdmin?8:7}><div className="empty-state"><p>لا توجد عروض</p></div></td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {showForm && <QuoteForm user={user} onSave={()=>{setShowForm(false);onReload();}} onClose={()=>setShowForm(false)}/>}
      {editing && !editing._convertToInvoice && (
        <QuoteForm user={user} quote={editing} onSave={()=>{setEditing(null);onReload();}} onClose={()=>setEditing(null)}/>
      )}
      {editing && editing._convertToInvoice && (
        <InvoiceEditModal user={user} quote={editing} onSave={()=>{setEditing(null);onReload();}} onClose={()=>setEditing(null)}/>
      )}
      {previewing && <DocPreview doc={previewing} items={previewItems} docType="quote" onClose={()=>setPreviewQ(null)}/>}
      {orderingQ && <OrderEditModal user={user} quote={orderingQ} onSave={()=>{setOrderingQ(null);onReload();}} onClose={()=>setOrderingQ(null)}/>}
    </div>
  );
}

/* ===================== ORDER EDIT MODAL (تعديل قبل إصدار الطلب) ===================== */
function OrderEditModal({ user, quote, onSave, onClose }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({
    customer_name: quote.customer_name || '',
    phone:         quote.phone || '',
    currency:      quote.currency || 'JOD',
    notes:         '',
    expected_delivery: '',
  });
  const setF = (k,v) => setForm(f=>({...f,[k]:v}));

  useEffect(() => {
    const t = setTimeout(() => setLoading(false), 6000);
    sb.from('quotation_items').select('*').eq('quotation_id', quote.id).order('sort_order')
      .then(({data}) => { setItems(data||[]); setLoading(false); clearTimeout(t); });
    return () => clearTimeout(t);
  }, []);

  const total = parseFloat(quote.nett_price||0);

  const handleIssue = async () => {
    if (!form.customer_name.trim()) { toast('يجب إدخال اسم العميل','error'); return; }
    setSaving(true);
    try {
      const { error } = await sb.from('orders').insert({
        quotation_id:      quote.id,
        quotation_number:  quote.number,
        customer_name:     form.customer_name,
        currency:          form.currency,
        total_amount:      total,
        notes:             form.notes || null,
        expected_delivery: form.expected_delivery || null,
        status:            'pending',
        created_by:        user?.id || null,
      });
      if (error) throw error;
      await sb.from('quotations').update({ status: 'converted' }).eq('id', quote.id);
      toast('تم إصدار الطلب بنجاح', 'success');
      onSave();
    } catch(e) { toast('خطأ: ' + e.message, 'error'); }
    finally { setSaving(false); }
  };

  if (loading) return <div className="modal-overlay"><div className="modal"><div style={{padding:40,textAlign:'center'}}><div className="spinner" style={{margin:'auto'}}/></div></div></div>;

  return (
    <div className="modal-overlay">
      <div className="modal" style={{maxWidth:860}}>
        <div className="modal-header" style={{background:'#F0FFF4',borderBottom:'2px solid var(--success)'}}>
          <span className="modal-title" style={{color:'var(--success)'}}>📦 إصدار طلب — مراجعة وتعديل قبل الإصدار</span>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">

          {/* بيانات الطلب */}
          <div className="section-title">بيانات الطلب</div>
          <div className="form-row mb-4">
            <div className="form-group">
              <label className="form-label">اسم العميل *</label>
              <input className="form-control" value={form.customer_name} onChange={e=>setF('customer_name',e.target.value)}/>
            </div>
            <div className="form-group">
              <label className="form-label">هاتف</label>
              <input className="form-control" value={form.phone} onChange={e=>setF('phone',e.target.value)}/>
            </div>
          </div>
          <div className="form-row mb-4">
            <div className="form-group">
              <label className="form-label">العملة</label>
              <select className="form-control" value={form.currency} onChange={e=>setF('currency',e.target.value)}>
                <option>JOD</option><option>USD</option><option>EUR</option>
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">تاريخ التسليم المتوقع</label>
              <input type="date" className="form-control" value={form.expected_delivery} onChange={e=>setF('expected_delivery',e.target.value)}/>
            </div>
          </div>
          <div className="form-group mb-4">
            <label className="form-label">ملاحظات على الطلب</label>
            <textarea className="form-control" rows="2" value={form.notes} onChange={e=>setF('notes',e.target.value)} placeholder="أي ملاحظات خاصة بالطلب..."/>
          </div>

          {/* معلومات العرض المصدر */}
          <div className="section-title">الأصناف — من عرض السعر {quote.number}</div>
          <div className="table-wrap" style={{marginBottom:14}}>
            <table className="print-items" style={{fontSize:12}}>
              <thead>
                <tr><th>#</th><th>المنتج</th><th>الوحدة</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th><th>المنشأ</th><th>التوصيل</th></tr>
              </thead>
              <tbody>
                {items.map((it,i) => (
                  <tr key={i}>
                    <td>{i+1}</td>
                    <td style={{textAlign:'right'}}>{it.item_name}</td>
                    <td>{it.unit||'EACH'}</td>
                    <td>{it.quantity}</td>
                    <td>{parseFloat(it.unit_price).toFixed(0)}</td>
                    <td><strong>{(parseFloat(it.quantity)*parseFloat(it.unit_price)).toFixed(0)}</strong></td>
                    <td>{it.origin||'CHINA'}</td>
                    <td>{it.delivery||'PROMPT'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* الإجمالي */}
          <div style={{display:'flex',justifyContent:'flex-end'}}>
            <div style={{background:'#F0FFF4',border:'1.5px solid var(--success)',borderRadius:8,padding:'10px 20px',textAlign:'center'}}>
              <div style={{fontSize:11,color:'var(--gray-500)',fontWeight:700}}>القيمة الإجمالية</div>
              <div style={{fontSize:22,fontWeight:900,color:'var(--success)'}}>{total.toFixed(3)} {form.currency}</div>
            </div>
          </div>
        </div>

        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose} disabled={saving}>إلغاء</button>
          <button className="btn btn-success" onClick={handleIssue} disabled={saving} style={{minWidth:140}}>
            {saving ? '...' : '📦 إصدار الطلب'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ===================== INVOICE EDIT MODAL (تعديل قبل تحويل لفاتورة) ===================== */
function InvoiceEditModal({ user, quote, onSave, onClose }) {
  const [form, setForm] = useState({ ...quote });
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [previewing, setPreviewing] = useState(false);

  useEffect(() => {
    sb.from('quotation_items').select('*').eq('quotation_id', quote.id).order('sort_order')
      .then(({ data, error }) => {
        if (error) console.warn('Items fetch error:', error.message);
        setItems(data||[]);
        setLoading(false);
      })
      .catch(err => {
        console.warn('Items fetch failed:', err);
        setLoading(false);
      });
    // safety timeout
    const t = setTimeout(() => setLoading(false), 6000);
    return () => clearTimeout(t);
  }, []);

  const setF = (k,v) => setForm(f => ({...f,[k]:v}));
  const setItem = (idx,k,v) => setItems(i => i.map((it,j) => j===idx ? {...it,[k]:v} : it));
  const addItem = () => setItems(i => [...i, { item_name:'', unit:'EACH', quantity:1, unit_price:0, origin:'CHINA', delivery:'PROMPT', notes:'' }]);
  const removeItem = (idx) => setItems(i => i.filter((_,j)=>j!==idx));

  const subtotal = items.reduce((s,i) => s+(parseFloat(i.quantity||0)*parseFloat(i.unit_price||0)), 0);
  const disc_amt = subtotal * parseFloat(form.discount_pct||0) / 100;
  const after_disc = subtotal - disc_amt;
  const tax_amt = after_disc * parseFloat(form.tax_pct||0) / 100;
  const nett = after_disc + tax_amt;

  const calcForm = { ...form, subtotal: subtotal.toFixed(3), discount_amt: disc_amt.toFixed(3), tax_amt: tax_amt.toFixed(3), nett_price: nett.toFixed(3) };

  const handleConvert = async () => {
    setSaving(true);
    try {
      // تحديث بيانات العرض الأصلي
      await sb.from('quotations').update({
        customer_name: form.customer_name,
        attention: form.attention || null,
        phone: form.phone || null,
        date: form.date,
        reference: form.reference || null,
        currency: form.currency,
        discount_pct: parseFloat(form.discount_pct) || 0,
        tax_pct: parseFloat(form.tax_pct) || 16,
        notes: form.notes || null,
        subtotal: subtotal.toFixed(3),
        discount_amt: disc_amt.toFixed(3),
        tax_amt: tax_amt.toFixed(3),
        nett_price: nett.toFixed(3),
        status: 'invoiced',
      }).eq('id', quote.id);

      // تحديث الأصناف
      await sb.from('quotation_items').delete().eq('quotation_id', quote.id);
      const itemRows = items.filter(i=>i.item_name?.trim()).map((i,idx) => ({
        quotation_id: quote.id, sort_order: idx,
        item_name: i.item_name, description: i.description||'',
        unit: i.unit||'EACH', quantity: parseFloat(i.quantity)||1,
        unit_price: parseFloat(i.unit_price)||0,
        origin: i.origin||'CHINA', delivery: i.delivery||'PROMPT', notes: i.notes||''
      }));
      await sb.from('quotation_items').insert(itemRows);

      // log skipped

      toast('تم إصدار الفاتورة بنجاح', 'success');
      onSave();
    } catch (err) {
      toast('خطأ: ' + err.message, 'error');
    } finally {
      setSaving(false);
    }
  };

  if (loading) return <div className="modal-overlay"><div className="modal"><div style={{padding:40,textAlign:'center'}}><div className="spinner" style={{margin:'auto'}}/></div></div></div>;

  return (
    <div className="modal-overlay">
      <div className="modal" style={{maxWidth:950}}>
        <div className="modal-header" style={{background:'#F0F8FD',borderBottom:'2px solid var(--primary)'}}>
          <span className="modal-title" style={{color:'var(--primary)'}}>🧾 تحويل لفاتورة — مراجعة وتعديل قبل الإصدار</span>
          <div className="flex gap-2">
            <button className="btn btn-ghost btn-sm" onClick={()=>setPreviewing(true)}>👁 معاينة</button>
            <button className="modal-close" onClick={onClose}>✕</button>
          </div>
        </div>
        <div className="modal-body">
          <div style={{background:'#F0F8FD',border:'1px solid #B8DCF0',borderRadius:8,padding:'10px 14px',marginBottom:16,fontSize:12,color:'#666'}}>
            ✅ راجع وعدّل البيانات أدناه قبل إصدار الفاتورة. رقم المرجع: <strong>{quote.number}</strong>
          </div>

          <div className="form-row mb-4">
            <div className="form-group"><label className="form-label">اسم العميل *</label><input className="form-control" value={form.customer_name} onChange={e=>setF('customer_name',e.target.value)}/></div>
            <div className="form-group"><label className="form-label">عناية</label><input className="form-control" value={form.attention||''} onChange={e=>setF('attention',e.target.value)}/></div>
          </div>
          <div className="form-row-3 mb-4">
            <div className="form-group"><label className="form-label">هاتف</label><input className="form-control" value={form.phone||''} onChange={e=>setF('phone',e.target.value)}/></div>
            <div className="form-group"><label className="form-label">تاريخ الفاتورة</label><input type="date" className="form-control" value={form.date} onChange={e=>setF('date',e.target.value)}/></div>
            <div className="form-group"><label className="form-label">المرجع</label><input className="form-control" value={form.reference||''} onChange={e=>setF('reference',e.target.value)}/></div>
          </div>
          <div className="form-row mb-4">
            <div className="form-group"><label className="form-label">الخصم %</label><input type="number" min="0" className="form-control" value={form.discount_pct} onChange={e=>setF('discount_pct',e.target.value)}/></div>
            <div className="form-group"><label className="form-label">الضريبة %</label><input type="number" min="0" className="form-control" value={form.tax_pct} onChange={e=>setF('tax_pct',e.target.value)}/></div>
          </div>

          <div className="section-title" style={{marginBottom:10}}>الأصناف — يمكنك التعديل</div>
          <div className="table-wrap" style={{marginBottom:10}}>
            <table className="items-table">
              <thead>
                <tr><th>#</th><th>المنتج</th><th>الوحدة</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th><th>المنشأ</th><th>التوصيل</th><th></th></tr>
              </thead>
              <tbody>
                {items.map((item,i) => {
                  const tot = (parseFloat(item.quantity||0)*parseFloat(item.unit_price||0)).toFixed(3);
                  return (
                    <tr key={i}>
                      <td>{i+1}</td>
                      <td><input value={item.item_name||''} onChange={e=>setItem(i,'item_name',e.target.value)}/></td>
                      <td><input value={item.unit||'EACH'} onChange={e=>setItem(i,'unit',e.target.value)}/></td>
                      <td><input type="number" value={item.quantity} onChange={e=>setItem(i,'quantity',e.target.value)}/></td>
                      <td><input type="number" step="0.001" value={item.unit_price} onChange={e=>setItem(i,'unit_price',e.target.value)}/></td>
                      <td style={{fontWeight:700,color:'var(--primary)'}}>{tot}</td>
                      <td><input value={item.origin||'CHINA'} onChange={e=>setItem(i,'origin',e.target.value)}/></td>
                      <td><select value={item.delivery||'PROMPT'} onChange={e=>setItem(i,'delivery',e.target.value)}><option>PROMPT</option><option>2-4 WEEKS</option><option>4-6 WEEKS</option></select></td>
                      <td><button onClick={()=>removeItem(i)} style={{background:'none',border:'none',color:'var(--danger)',fontSize:16,cursor:'pointer'}}>×</button></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={addItem}>+ إضافة صنف</button>

          <div style={{marginTop:12, background:'#F0F8FD', border:'1.5px solid #B8DCF0', borderRadius:8, padding:12, maxWidth:280, marginRight:'auto'}}>
            <table style={{width:'100%',fontSize:12}}>
              <tbody>
                <tr><td>Sub Total</td><td style={{textAlign:'left'}}>{subtotal.toFixed(3)}</td></tr>
                <tr><td>Discount ({form.discount_pct}%)</td><td style={{textAlign:'left',color:'var(--danger)'}}>{disc_amt.toFixed(3)}</td></tr>
                <tr><td>Sales Tax ({form.tax_pct}%)</td><td style={{textAlign:'left'}}>{tax_amt.toFixed(3)}</td></tr>
                <tr style={{borderTop:'2px solid var(--primary)'}}><td style={{fontWeight:800,color:'var(--primary)'}}>Nett Price</td><td style={{textAlign:'left',fontWeight:800,color:'var(--primary)'}}>{nett.toFixed(3)} {form.currency}</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose} disabled={saving}>إلغاء</button>
          <button className="btn btn-purple" onClick={handleConvert} disabled={saving} style={{minWidth:140}}>
            {saving ? 'جاري الإصدار...' : '✅ إصدار الفاتورة'}
          </button>
        </div>
      </div>

      {previewing && <DocPreview doc={calcForm} items={items} docType="invoice" onClose={()=>setPreviewing(false)}/>}
    </div>
  );

/* ===================== PRINT FUNCTION ===================== */
const printDoc = (containerId) => {
  const el = document.getElementById(containerId);
  if (!el) return;

  // نخفي كل شيء في الصفحة ونظهر فقط الـ print content
  const body = document.body;
  const allChildren = Array.from(body.children);
  
  // نحفظ حالة visibility الحالية
  const originalStyles = allChildren.map(child => child.style.cssText);
  
  // نخفي كل شيء
  allChildren.forEach(child => {
    child.style.cssText = 'display: none !important;';
  });

  // ننشئ div مؤقت يحتوي محتوى الطباعة
  const printDiv = document.createElement('div');
  printDiv.id = 'temp-print-div';
  printDiv.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; z-index: 99999; background: white;';
  printDiv.innerHTML = el.innerHTML;
  body.appendChild(printDiv);

  // طباعة
  window.print();

  // نرجع كل شيء لحالته الأصلية
  body.removeChild(printDiv);
  allChildren.forEach((child, i) => {
    child.style.cssText = originalStyles[i];
  });
};

function CustomerForm({ customer, profiles, user, onSave, onClose }) {
  const [form, setForm] = useState({ name:'', phone:'', alt_phone:'', address:'', website:'', notes:'', assigned_to:'', ...(customer||{}) });
  const [loading, setLoading] = useState(false);
  const setF = (k,v) => setForm(f=>({...f,[k]:v}));
  const handleSave = async () => {
    if (!form.name.trim()) { toast('يجب إدخال اسم العميل','error'); return; }
    setLoading(true);
    try {
      const payload = { name:form.name, phone:form.phone||null, alt_phone:form.alt_phone||null, address:form.address||null, website:form.website||null, notes:form.notes||null, assigned_to:form.assigned_to||null, updated_at:new Date().toISOString() };
      if (customer?.id) {
        const {error} = await sb.from('customers').update(payload).eq('id', customer.id);
        if(error) throw error;
      } else {
        payload.created_by = user?.id || null;
        const {error} = await sb.from('customers').insert(payload);
        if(error) throw error;
      }
      toast(customer ? 'تم التعديل' : 'تمت الإضافة', 'success');
      onSave();
    } catch(e) { toast('خطأ: ' + e.message, 'error'); }
    finally { setLoading(false); }

  return (
    <div className="modal-overlay">

                    <td>
                      <div className="flex gap-2">
                        <button className="btn btn-ghost btn-sm" onClick={()=>setSelected(c)} title="عرض">👁</button>
                        <button className="btn btn-ghost btn-sm" onClick={()=>{ setEditing(c); setShowForm(true); }} title="تعديل">✏️</button>
                        {user?.role==='admin' && <button className="btn btn-danger btn-sm" onClick={()=>deleteCustomer(c)}>🗑</button>}
                      </div>
                    </td>
                  </tr>
                ))}
                {filtered.length===0 && <tr><td colSpan="6"><div className="empty-state"><p>لا يوجد عملاء بعد</p><small>اضغط "+ عميل جديد" لإضافة أول عميل</small></div></td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}
      {showForm && <CustomerForm customer={editing} profiles={profiles} user={user} onSave={()=>{ setShowForm(false); load(); }} onClose={()=>setShowForm(false)}/>}
    </div>
  );
}

/* ===================== APP ===================== *//* ===================== APP ===================== */
function App() {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState('dashboard');
  const [quotes, setQuotes] = useState([]);
  const [orders, setOrders] = useState([]);
  const [logs, setLogs] = useState([]);

  useEffect(() => {
    // timeout للحماية من التعليق — إذا ما انتهى خلال 8 ثوانٍ نوقف التحميل
    const safetyTimer = setTimeout(() => {
      setLoading(false);
    }, 8000);

    sb.auth.getSession().then(async ({ data: { session }, error }) => {
      clearTimeout(safetyTimer);
      try {
        if (session?.user && !error) {
          // جلب الـ profile مع race timeout
          let profile = null;
          try {
            const res = await Promise.race([
              sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle(),
              new Promise((_,r) => setTimeout(() => r(new Error('timeout')), 6000))
            ]);
            profile = res.data;
          } catch(pe) {
            console.warn('Profile fetch timeout on restore:', pe.message);
          }
          // الـ id دايماً من auth.user (هو نفسه UUID في profiles)
          const u = {
            id: session.user.id,
            email: session.user.email,
            ...(profile || {}),
            // نضمن أن الـ id لا يُستبدل
            id: session.user.id,
          };
          setUser(u);
          loadData(session.user.id, u.role || 'employee');
        }
      } catch(e) {
        console.warn('Session restore error:', e);
      } finally {
        setLoading(false);
      }
    }).catch(() => {
      clearTimeout(safetyTimer);
      setLoading(false);
    });

    const { data: { subscription } } = sb.auth.onAuthStateChange(async (event, session) => {
      if (event==='SIGNED_IN' && session?.user) {
        try {
          let profile = null;
          try {
            const res = await Promise.race([
              sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle(),
              new Promise((_,r) => setTimeout(() => r(new Error('t')), 5000))
            ]);
            profile = res.data;
          } catch(pe) {}
          const u = {
            id: session.user.id,
            email: session.user.email,
            ...(profile || {}),
            id: session.user.id,
          };
          setUser(u);
          loadData(session.user.id, u.role || 'employee');
        } catch(e) { console.warn('Auth change error:', e); }
      }
      if (event==='SIGNED_OUT') {
        setUser(null); setQuotes([]); setOrders([]); setLogs([]);
      }
    });
    return () => {
      clearTimeout(safetyTimer);
      subscription.unsubscribe();
    };
  }, []);

  const loadData = async (userId, role) => {
    if (!userId) { console.warn('loadData: no userId'); return; }
    // timeout 10 ثوانٍ لكل query
    const withTimeout = (promise, ms=10000) =>
      Promise.race([promise, new Promise((_,r) => setTimeout(() => r(new Error('timeout')), ms))]);

    try {
      let qQ = sb.from('quotations').select('*').order('created_at', {ascending:false});
      let oQ = sb.from('orders').select('*').order('created_at', {ascending:false});
      let lQ = sb.from('activity_logs').select('*').order('created_at', {ascending:false}).limit(60);
      // RLS في Supabase تتحكم بالصلاحيات تلقائياً
      const results = await withTimeout(Promise.all([qQ, oQ, lQ]));
      const [{ data: q, error: qe },{ data: o, error: oe },{ data: l, error: le }] = results;
      if (qe) console.warn('Quotes error:', qe.message);
      if (oe) console.warn('Orders error:', oe.message);
      if (le) console.warn('Logs error:', le.message);
      setQuotes(q||[]);
      setOrders(o||[]);
      setLogs(l||[]);
    } catch (err) {
      console.error('Load data error:', err.message);
      // نعرض بيانات فارغة بدلاً من التعليق
      setQuotes([]); setOrders([]); setLogs([]);
    }
  };

  const handleLogin = (u) => { setUser(u); loadData(u.id, u.role); };
  const handleLogout = async () => {
    try {
      await sb.auth.signOut();
    } catch(e) {
      console.warn('Signout error:', e);
    }
    // تنظيف كامل للحالة
    setUser(null);
    setQuotes([]);
    setOrders([]);
    setLogs([]);
    setPage('dashboard');
    // تنظيف localStorage/sessionStorage من أي جلسة قديمة
    try {
      Object.keys(localStorage).forEach(k => {
        if (k.startsWith('sb-') || k.includes('supabase')) localStorage.removeItem(k);
      });
    } catch(e) {}
    toast('تم تسجيل الخروج بنجاح', 'info');
  };
  const reload = () => user && loadData(user.id, user.role);

  if (loading) return <LoadingScreen msg="جاري تحميل النظام..."/>;
  if (!user) return <><AuthPage onLogin={handleLogin}/><Toasts/></>;

  const titles = { dashboard:'لوحة التحكم', quotes:'عروض الأسعار', 'new-quote':'عرض جديد', invoices:'الفواتير', orders:'الطلبات', customers:'العملاء', archive:'الأرشيف', activity:'سجل النشاط', users:'المستخدمون' };

  return (
    <div className="app-layout">
      <Sidebar user={user} page={page} setPage={setPage} onLogout={handleLogout}/>
      <div className="main">
        <div className="topbar">
          <span className="topbar-title">{titles[page]||''}</span>
          <span style={{fontSize:12,color:'var(--gray-400)'}}>{new Date().toLocaleDateString('ar',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</span>
        </div>
        <div className="content">
          {page==='dashboard' && <Dashboard quotes={quotes} orders={orders} logs={logs} user={user}/>}
          {page==='quotes' && <QuotesList user={user} quotes={quotes} onReload={reload}/>}
          {page==='invoices' && <InvoicesPage user={user} quotes={quotes} onReload={reload}/>}
          {page==='orders' && <OrdersPage user={user} orders={orders} onReload={reload}/>}
          {page==='customers' && <CustomersPage user={user}/>}
          {page==='archive' && <ArchivePage user={user} quotes={quotes} orders={orders} onReload={reload}/>}
          {page==='activity' && <ActivityPage logs={logs}/>}
          {page==='users' && user.role==='admin' && <UsersPage/>}
        </div>
      </div>
      <Toasts/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
