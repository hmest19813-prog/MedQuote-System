<title>MedQuote Pro — نظام عروض الأسعار</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1e;--bg2:#0f1629;--bgc:#141c2e;--bgh:#1a2438;
  --bdr:#1e2d4a;--bdrl:#253352;
  --blue:#2563eb;--cyan:#06b6d4;--green:#10b981;--amber:#f59e0b;--rose:#f43f5e;--purple:#8b5cf6;
  --t1:#f0f4ff;--t2:#94a3b8;--t3:#4a5a7a;
  --grad:linear-gradient(135deg,#2563eb,#06b6d4);
  --r:12px;--rl:16px;
  --font:'IBM Plex Sans Arabic',sans-serif;--mono:'IBM Plex Mono',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--t1);min-height:100vh;direction:rtl}
#root{min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bdrl);border-radius:3px}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:255px;min-height:100vh;background:var(--bg2);border-left:1px solid var(--bdr);display:flex;flex-direction:column;position:fixed;top:0;right:0;z-index:100}
.main{flex:1;margin-right:255px;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:60px;background:var(--bg2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:50}
.content{flex:1;padding:24px;overflow-x:hidden}

/* Sidebar */
.sb-logo{padding:18px 18px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:11px}
.sb-logo-icon{width:38px;height:38px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 20px rgba(37,99,235,.3)}
.sb-logo-text{font-size:14px;font-weight:700;line-height:1.2}
.sb-logo-sub{font-size:11px;color:var(--t3)}
.nav-sec{padding:10px 10px 2px}
.nav-lbl{font-size:10px;color:var(--t3);font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:0 8px 7px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;cursor:pointer;transition:all .18s;margin-bottom:2px;color:var(--t2);font-size:13px;font-weight:500;border:1px solid transparent}
.nav-item:hover{background:var(--bgh);color:var(--t1)}
.nav-item.active{background:rgba(37,99,235,.15);color:#60a5fa;border-color:rgba(37,99,235,.3)}
.nav-icon{font-size:15px;width:19px;text-align:center}
.sb-bottom{margin-top:auto;padding:14px;border-top:1px solid var(--bdr)}
.user-card{display:flex;align-items:center;gap:9px;padding:9px;border-radius:7px;background:var(--bgh);cursor:pointer}
.u-avatar{width:34px;height:34px;border-radius:7px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.u-name{font-size:12px;font-weight:600}
.u-role{font-size:11px;color:var(--cyan)}

/* Cards */
.card{background:var(--bgc);border:1px solid var(--bdr);border-radius:var(--rl)}
.stat-card{padding:18px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:100%;height:2px}
.stat-card.blue::before{background:var(--blue)}.stat-card.cyan::before{background:var(--cyan)}
.stat-card.green::before{background:var(--green)}.stat-card.amber::before{background:var(--amber)}
.stat-card.rose::before{background:var(--rose)}.stat-card.purple::before{background:var(--purple)}
.stat-icon{font-size:26px;margin-bottom:6px}
.stat-val{font-size:26px;font-weight:700;font-family:var(--mono)}
.stat-lbl{font-size:12px;color:var(--t2)}
.stat-chg{font-size:11px;color:var(--green);margin-top:3px}

/* Grids */
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:14px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .18s;font-family:var(--font);white-space:nowrap}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:#1d4ed8;box-shadow:0 4px 12px rgba(37,99,235,.4)}
.btn-s{background:var(--bgh);color:var(--t1);border:1px solid var(--bdrl)}.btn-s:hover{background:var(--bdr)}
.btn-d{background:rgba(244,63,94,.12);color:var(--rose);border:1px solid rgba(244,63,94,.3)}.btn-d:hover{background:rgba(244,63,94,.22)}
.btn-g{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.3)}.btn-g:hover{background:rgba(16,185,129,.22)}
.btn-sm{padding:5px 9px;font-size:11px}.btn-lg{padding:11px 22px;font-size:14px}.btn-ic{padding:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Forms */
.fg{margin-bottom:14px}
.flbl{display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.fc{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--bdr);border-radius:7px;color:var(--t1);font-size:13px;font-family:var(--font);transition:all .18s;direction:rtl}
.fc:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.fc::placeholder{color:var(--t3)}
textarea.fc{resize:vertical;min-height:75px}
select.fc{cursor:pointer}
input[type=number]{direction:ltr;text-align:right}

/* Tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:1px solid var(--bdr)}
th{padding:9px 13px;font-size:10px;font-weight:600;color:var(--t3);text-align:right;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
td{padding:11px 13px;font-size:13px;border-bottom:1px solid rgba(30,45,74,.4)}
tr:hover td{background:var(--bgh)}
tr:last-child td{border-bottom:none}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-draft{background:rgba(148,163,184,.12);color:#94a3b8}
.b-sent{background:rgba(6,182,212,.12);color:#06b6d4}
.b-approved{background:rgba(16,185,129,.12);color:#10b981}
.b-rejected{background:rgba(244,63,94,.12);color:#f43f5e}
.b-converted{background:rgba(139,92,246,.12);color:#8b5cf6}
.b-pending{background:rgba(245,158,11,.12);color:#f59e0b}
.b-confirmed{background:rgba(16,185,129,.12);color:#10b981}
.b-processing{background:rgba(37,99,235,.12);color:#60a5fa}
.b-delivered{background:rgba(16,185,129,.18);color:#10b981;border:1px solid rgba(16,185,129,.25)}
.b-cancelled{background:rgba(244,63,94,.12);color:#f43f5e}
.b-admin{background:rgba(139,92,246,.12);color:#8b5cf6}
.b-employee{background:rgba(37,99,235,.12);color:#60a5fa}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--bgc);border:1px solid var(--bdrl);border-radius:var(--rl);width:100%;max-width:960px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.mh{padding:18px 22px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bgc);z-index:1}
.mt{font-size:16px;font-weight:700}
.mb{padding:22px}
.mf{padding:14px 22px;border-top:1px solid var(--bdr);display:flex;gap:8px}

/* Page header */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.pt{font-size:21px;font-weight:700}
.ps{font-size:12px;color:var(--t2);margin-top:2px}
.bc{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3);margin-bottom:5px}
.bc span{cursor:pointer}.bc span:hover{color:var(--cyan)}

/* Section header */
.sch{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.sct{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}

/* Toast */
.toast-wrap{position:fixed;top:18px;left:18px;z-index:9999;display:flex;flex-direction:column;gap:7px}
.toast{padding:11px 15px;border-radius:9px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:sin .25s ease;min-width:270px}
.t-success{background:#064e3b;border:1px solid #10b981;color:#6ee7b7}
.t-error{background:#4c0519;border:1px solid #f43f5e;color:#fda4af}
.t-info{background:#1e3a5f;border:1px solid #2563eb;color:#93c5fd}
@keyframes sin{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}

/* Auth */
.auth-pg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 60% 20%,rgba(37,99,235,.11) 0%,transparent 60%),radial-gradient(ellipse at 20% 80%,rgba(6,182,212,.07) 0%,transparent 50%),var(--bg)}
.auth-card{width:100%;max-width:410px;background:var(--bgc);border:1px solid var(--bdrl);border-radius:20px;padding:38px;box-shadow:0 32px 80px rgba(0,0,0,.5)}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-li{width:62px;height:62px;border-radius:15px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 11px;box-shadow:0 8px 24px rgba(37,99,235,.38)}
.auth-t{font-size:21px;font-weight:700;text-align:center}
.auth-s{font-size:12px;color:var(--t2);text-align:center;margin-top:3px}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:16px}
.demo-btn{padding:10px 11px;cursor:pointer}

/* Items table */
.it{width:100%;border-collapse:collapse}
.it th{background:var(--bg);padding:7px 8px;font-size:10px;color:var(--t3);text-align:right;border:1px solid var(--bdr);white-space:nowrap}
.it td{padding:4px 5px;border:1px solid var(--bdr)}
.it input,.it select{background:var(--bg2);border:none;color:var(--t1);padding:5px 7px;width:100%;font-family:var(--font);font-size:12px;border-radius:3px}
.it input:focus,.it select:focus{outline:1px solid var(--blue)}

/* Summary */
.sum{background:var(--bg);border-radius:9px;padding:14px;border:1px solid var(--bdr)}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
.sum-row.total{border-top:1px solid var(--bdr);margin-top:4px;padding-top:9px;font-size:14px;font-weight:700;color:var(--cyan)}

/* Activity */
.act-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid rgba(30,45,74,.4)}
.act-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.act-time{font-size:10px;color:var(--t3);margin-top:2px}

/* Tabs */
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--bdr);margin-bottom:18px}
.tab{padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;color:var(--t2);transition:all .18s}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab:hover:not(.active){color:var(--t1)}

/* Progress */
.prog{height:5px;background:var(--bdr);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .5s}

/* Spinner */
.spin{width:22px;height:22px;border:2px solid var(--bdr);border-top-color:var(--blue);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* Empty */
.empty{text-align:center;padding:55px 20px}
.empty-ic{font-size:46px;margin-bottom:10px;opacity:.45}
.empty-t{font-size:15px;font-weight:600;color:var(--t2)}
.empty-s{font-size:12px;color:var(--t3);margin-top:3px}

/* Dropdown */
.dd{position:relative}
.dd-menu{position:absolute;top:100%;right:0;z-index:200;min-width:155px;background:var(--bgc);border:1px solid var(--bdrl);border-radius:9px;box-shadow:0 8px 30px rgba(0,0,0,.5);margin-top:3px;overflow:hidden}
.dd-item{padding:9px 13px;font-size:13px;cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:7px}
.dd-item:hover{background:var(--bgh)}
.dd-item.danger{color:var(--rose)}

/* Quote preview */
.qp-wrap{border:3px solid #1a3a6e;border-radius:8px;overflow:hidden;background:#fff;color:#1a1a1a}
.qp-hdr{background:#1a3a6e;color:#fff;padding:15px 22px;display:flex;justify-content:space-between;align-items:center}
.qp-info{background:#eef2ff;padding:11px 22px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;font-size:13px}
.qp table{width:100%;border-collapse:collapse}
.qp th{background:#1a3a6e;color:#fff;padding:7px 10px;font-size:11px;text-align:center}
.qp td{padding:6px 10px;font-size:11px;border:1px solid #ccc;text-align:center}
.qp tr:nth-child(even) td{background:#f5f8ff}
.qp-terms{padding:11px 22px;background:#fffbeb;border-top:1px solid #fde68a;font-size:11px}
.qp-foot{padding:11px 22px;background:#f8faff;border-top:1px solid #ddd;display:flex;justify-content:space-between;font-size:12px}

/* Divider */
.div-t{display:flex;align-items:center;gap:9px;margin:14px 0}
.div-t::before,.div-t::after{content:'';flex:1;height:1px;background:var(--bdr)}
.div-t span{font-size:10px;color:var(--t3);white-space:nowrap}

/* Topbar */
.tb-l,.tb-r{display:flex;align-items:center;gap:10px}
.tb-title{font-size:15px;font-weight:700}

/* Notif */
.notif-btn{position:relative}
.notif-dot{position:absolute;top:2px;left:2px;width:7px;height:7px;background:var(--rose);border-radius:50%;border:2px solid var(--bg2)}

/* Mini chart bars (CSS only) */
.minichart{display:flex;align-items:flex-end;gap:4px;height:80px;padding:8px 0}
.bar-group{display:flex;gap:2px;align-items:flex-end;flex:1}
.bar{border-radius:3px 3px 0 0;min-width:8px;transition:all .4s}
.bar-lbl{font-size:9px;color:var(--t3);text-align:center;margin-top:3px}
.chart-legend{display:flex;gap:12px;font-size:11px;color:var(--t2);margin-top:8px}
.legend-dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-left:4px}

/* Responsive */
@media(max-width:1100px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.sidebar{transform:translateX(255px);transition:transform .3s}.sidebar.open{transform:translateX(0)}.main{margin-right:0}.g5,.g4,.g3,.g2,.g21{grid-template-columns:1fr}}
</style>

// ── DONUT STATUS CHART ───────────────────────────────────
function StatusDonut({data}){

    offset+=pct;return arc;

// ── APP ───────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(()=>{try{const s=localStorage.getItem('mq_session');return s?JSON.parse(s):null;}catch{return null;}});
  const [page,setPage]=useState('dashboard');
  const [quotations,setQuotations]=useState(()=>load('mq_quotations',INIT_Q));
  const [orders,setOrders]=useState(()=>load('mq_orders',INIT_O));
  const [logs,setLogs]=useState(()=>load('mq_logs',INIT_L));
  const [toasts,setToasts]=useState([]);

  // Persist to localStorage on change
  useEffect(()=>{save('mq_quotations',quotations);},[quotations]);
  useEffect(()=>{save('mq_orders',orders);},[orders]);
  useEffect(()=>{save('mq_logs',logs);},[logs]);

  const addToast=useCallback((msg,type='info')=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3000);
  },[]);

  const addLog=useCallback((u,action,target)=>{
    setLogs(p=>[...p,{id:Date.now(),userId:u.id,userName:u.name,action,target,createdAt:now()}]);
  },[]);

  const logout=()=>{localStorage.removeItem('mq_session');setUser(null);setPage('dashboard');};
  const onLogin=(u)=>{save('mq_session',u);setUser(u);};

  if(!user)return React.createElement(AuthPage,{onLogin});

  const props={quotations,setQuotations,orders,setOrders,user,addLog,addToast,setPage,logs};

  const pages={
    dashboard:React.createElement(Dashboard,props),
    quotations:React.createElement(QuotsList,props),
    'new-q':React.createElement(NewQPage,props),
    orders:React.createElement(OrdersPage,props),
    archive:React.createElement(ArchivePage,props),
    users:user.role==='admin'?React.createElement(UsersPage,{user,addToast}):null,
    activity:user.role==='admin'?React.createElement(ActivityPage,{logs}):null,
  };

  return React.createElement('div',{className:'app'},
    React.createElement(Sidebar,{page,setPage,user,logout}),
    React.createElement('div',{className:'main'},
      React.createElement(Topbar,{page,user}),
      React.createElement('div',{className:'content'},
        pages[page]||React.createElement('div',{className:'empty'},React.createElement('div',{className:'empty-ic'},'🔒'),React.createElement('div',{className:'empty-t'},'غير مصرح بالوصول'))
      )
    ),
    React.createElement(Toasts,{toasts}),
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
