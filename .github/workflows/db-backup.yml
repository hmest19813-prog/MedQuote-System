name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *' # كل يوم الساعة 2 صباحاً UTC (5 صباحاً بتوقيت السعودية)
  workflow_dispatch: # يتيح التشغيل اليدوي من GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y curl ca-certificates
          curl https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Run pg_dump
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          mkdir -p backups
          FILENAME="backups/backup_$(date +%Y-%m-%d).sql"
          pg_dump -h aws-1-ap-northeast-2.pooler.supabase.com -p 5432 -U postgres.uzichxyfewvnicoqyqul -d postgres > "$FILENAME"
          echo "Backup created: $FILENAME"
          ls -lh "$FILENAME"

      - name: Verify backup is not empty or suspiciously small
        run: |
          FILENAME="backups/backup_$(date +%Y-%m-%d).sql"
          SIZE=$(stat -c%s "$FILENAME")
          echo "Backup file size: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::Backup file is only $SIZE bytes — looks incomplete or empty, failing the job so it doesn't get committed silently"
            exit 1
          fi

      - name: Keep last 30 backups only
        run: |
          cd backups
          COUNT=$(ls *.sql 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 30 ]; then
            ls -t *.sql | tail -n +31 | xargs rm -f
            echo "Cleaned old backups, kept last 30"
          fi

      - name: Commit and push backup
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add backups/
          git diff --staged --quiet && echo "No changes to commit" || \
            (git commit -m "db backup $(date +%Y-%m-%d)" && git push)

  notify-on-failure:
    needs: backup
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open a GitHub issue so the failure doesn't go unnoticed
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ فشل الباكب اليومي — ${new Date().toISOString().slice(0, 10)}`,
              body: `عملية النسخ الاحتياطي التلقائي لقاعدة البيانات فشلت اليوم.\n\nراجع سجل التشغيل هون:\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
