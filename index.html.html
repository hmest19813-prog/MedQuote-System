const timeAgo = (dt) => {
  const diff = (Date.now() - new Date(dt)) / 60000;
  if (diff < 60) return `منذ ${Math.floor(diff)} دقيقة`;
  if (diff < 1440) return `منذ ${Math.floor(diff/60)} ساعة`;
  return `منذ ${Math.floor(diff/1440)} يوم`;
};

  const emptyItem = () => ({id:Date.now(), name:'', description:'', unit:'', qty:1, unitPrice:0, total:0, origin:'', delivery:'PROMPT', notes:''});
  const [form, setForm] = useState(initial || {
    customer:'', attention:'', phone:'', address:'', date:today(),

    preparedBy: user.name, delivery:'PROMPT', discountPct:5, taxPct:16,
    items:[emptyItem()],
  });

  const updateField = (k,v) => setForm(p=>({...p,[k]:v}));
  const updateItem = (idx,k,v) => {
    setForm(p => {
      const items = [...p.items];
      items[idx] = {...items[idx], [k]:v};
      if(k==='qty'||k==='unitPrice') items[idx].total = (parseFloat(items[idx].qty)||0)*(parseFloat(items[idx].unitPrice)||0);
      return {...p, items};
    });
  };
  const addItem = () => setForm(p=>({...p, items:[...p.items, emptyItem()]}));

  const subtotal = form.items.reduce((s,i)=>s+(parseFloat(i.total)||0),0);

  const taxAmt = grandTotal * (parseFloat(form.taxPct)||0) / 100;

// ========================
function QuotationsList({quotations, setQuotations, orders, setOrders, user, addLog, addToast, setPage}) {
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [editingQuote, setEditingQuote] = useState(null);
  const [previewQuote, setPreviewQuote] = useState(null);
  const [showDropdown, setShowDropdown] = useState(null);

  const myQuotes = (user.role==='admin' ? quotations : quotations.filter(q=>q.createdBy===user.id))
    .filter(q=>!q.archived);

  const filtered = myQuotes.filter(q => {
    const matchSearch = !search || q.number.toLowerCase().includes(search.toLowerCase()) || q.customer.includes(search);
    const matchStatus = statusFilter==='all' || q.status===statusFilter;
    return matchSearch && matchStatus;
  });

  const updateStatus = (id, status) => {
    setQuotations(p => p.map(q => q.id===id ? {...q, status} : q));
    addLog(user, `تغيير حالة عرض السعر إلى ${statusLabel[status]}`, quotations.find(q=>q.id===id)?.number||'');
    addToast('تم تحديث الحالة', 'success');
    setShowDropdown(null);
  };

  const archiveQuote = (id) => {
    setQuotations(p => p.map(q => q.id===id ? {...q, archived:true} : q));
    addToast('تم أرشفة عرض السعر', 'success');
    setShowDropdown(null);
  };

  const deleteQuote = (id) => {
    if(!confirm('هل أنت متأكد من الحذف؟')) return;
    setQuotations(p => p.filter(q => q.id!==id));
    addToast('تم حذف عرض السعر', 'success');
    setShowDropdown(null);
  };

  const convertToOrder = (quote) => {
    const newOrder = {
      id: Date.now(), number: nextONum(orders),
      quotationId: quote.id, quotationNumber: quote.number,
      customer: quote.customer, status: 'pending',
      total: quote.nettPrice, items: quote.items,
      createdBy: user.id, createdByName: user.name,
      createdAt: now(), archived: false,
      currency: quote.currency,
    };
    setOrders(p => [...p, newOrder]);
    setQuotations(p => p.map(q => q.id===quote.id ? {...q, status:'converted'} : q));
    addLog(user, 'تحويل عرض سعر لطلب', newOrder.number);
    addToast(`تم إنشاء الطلب ${newOrder.number}`, 'success');
    setShowDropdown(null);
  };

  const duplicateQuote = (quote) => {
    const newQ = {
      ...quote, id: Date.now(),
      number: nextQNum(quotations.filter(q=>!q.archived)),
      date: today(), status: 'draft',
      createdBy: user.id, createdByName: user.name,
      createdAt: now(),
    };
    setQuotations(p => [...p, newQ]);
    addLog(user, 'نسخ عرض سعر', newQ.number);
    addToast('تم نسخ عرض السعر', 'success');
    setShowDropdown(null);
  };

  if(editingQuote) {
    const saveEdit = (data) => {
      setQuotations(p => p.map(q => q.id===editingQuote.id ? {...q, ...data, updatedAt:now()} : q));
      addLog(user, 'تعديل عرض سعر', editingQuote.number);
      addToast('تم حفظ التعديلات', 'success');
      setEditingQuote(null);
    };
    return React.createElement('div', null,
      React.createElement('div', {className:'page-header'},
        React.createElement('div', null,
          React.createElement('div', {className:'breadcrumb'},
            React.createElement('span', {onClick:()=>setEditingQuote(null)}, 'عروض الأسعار'),
            ' › تعديل '
          ),
          React.createElement('div', {className:'page-title'}, `تعديل: ${editingQuote.number}`),
        )
      ),
      React.createElement(QuotationForm, {initial:editingQuote, user, onSave:saveEdit, onCancel:()=>setEditingQuote(null), mode:'edit'})
    );
  }

  return React.createElement('div', null,
    React.createElement('div', {className:'page-header'},
      React.createElement('div', null,
        React.createElement('div', {className:'page-title'}, 'عروض الأسعار'),
        React.createElement('div', {className:'page-subtitle'}, `${filtered.length} عرض`),
      ),
      React.createElement('button', {className:'btn btn-primary', onClick:()=>setPage('new-quotation')}, '+ إنشاء عرض جديد'),
    ),

    React.createElement('div', {className:'card', style:{marginBottom:16}},
      React.createElement('div', {style:{padding:16, display:'flex', gap:12, flexWrap:'wrap', alignItems:'center'}},
        React.createElement('div', {className:'search-bar', style:{flex:1, minWidth:200}},
          React.createElement('input', {className:'form-control', placeholder:'🔍 بحث برقم العرض أو اسم العميل...', value:search, onChange:e=>setSearch(e.target.value)})
        ),
        React.createElement('select', {className:'form-control', style:{width:160}, value:statusFilter, onChange:e=>setStatusFilter(e.target.value)},
          React.createElement('option', {value:'all'}, 'جميع الحالات'),
          Object.entries(statusLabel).map(([v,l]) => React.createElement('option', {key:v, value:v}, l))
        ),
      )
    ),

    React.createElement('div', {className:'card'},
      filtered.length === 0 ?
        React.createElement('div', {className:'empty-state'},
          React.createElement('div', {className:'empty-icon'}, '📋'),
          React.createElement('div', {className:'empty-title'}, 'لا توجد عروض أسعار'),
          React.createElement('div', {className:'empty-sub'}, 'أنشئ عرض سعر جديد للبدء'),
        ) :
        React.createElement('div', {className:'table-wrapper'},
          React.createElement('table', null,
            React.createElement('thead', null, React.createElement('tr', null,
              ['رقم العرض','العميل','المرجع','التاريخ','القيمة','الحالة','بواسطة','إجراءات'].map(h =>
                React.createElement('th', {key:h}, h)
              )
            )),
            React.createElement('tbody', null,
              filtered.slice().reverse().map(q =>
                React.createElement('tr', {key:q.id},
                  React.createElement('td', null, React.createElement('span', {style:{fontFamily:'var(--font-mono)',fontSize:12,color:'#60a5fa',cursor:'pointer'}, onClick:()=>setPreviewQuote(q)}, q.number)),
                  React.createElement('td', {style:{fontWeight:500}}, q.customer),
                  React.createElement('td', {style:{color:'var(--text-secondary)',fontSize:12}}, q.reference||'—'),
                  React.createElement('td', {style:{fontSize:12,color:'var(--text-secondary)'}}, q.date),
                  React.createElement('td', null, React.createElement('span', {style:{fontFamily:'var(--font-mono)',fontSize:12}}, `${fmt(q.nettPrice)} ${q.currency}`)),
                  React.createElement('td', null, React.createElement(StatusBadge, {status:q.status})),
                  React.createElement('td', {style:{fontSize:12,color:'var(--text-secondary)'}}, q.createdByName),
                  React.createElement('td', null,
                    React.createElement('div', {style:{display:'flex',gap:4,position:'relative'}},
                      React.createElement('button', {className:'btn btn-secondary btn-sm', title:'معاينة', onClick:()=>setPreviewQuote(q)}, '👁'),
                      (user.role==='admin' || q.createdBy===user.id) && React.createElement('button', {className:'btn btn-secondary btn-sm', title:'تعديل', onClick:()=>setEditingQuote(q)}, '✏️'),
                      React.createElement('div', {className:'dropdown'},
                        React.createElement('button', {className:'btn btn-secondary btn-sm', onClick:()=>setShowDropdown(showDropdown===q.id?null:q.id)}, '⋮'),
                        showDropdown===q.id && React.createElement('div', {className:'dropdown-menu'},
                          React.createElement('div', {className:'dropdown-item', onClick:()=>duplicateQuote(q)}, '📋 نسخ العرض'),
                          q.status==='approved' && React.createElement('div', {className:'dropdown-item', onClick:()=>convertToOrder(q)}, '📦 تحويل لطلب'),
                          React.createElement('div', {className:'dropdown-item', onClick:()=>updateStatus(q.id,'sent')}, '📤 تعيين: مُرسل'),
                          React.createElement('div', {className:'dropdown-item', onClick:()=>updateStatus(q.id,'approved')}, '✅ تعيين: مُعتمد'),
                          React.createElement('div', {className:'dropdown-item', onClick:()=>updateStatus(q.id,'rejected')}, '❌ تعيين: مرفوض'),
                          React.createElement('div', {className:'dropdown-item', onClick:()=>archiveQuote(q.id)}, '🗄️ أرشفة'),
                          (user.role==='admin') && React.createElement('div', {className:'dropdown-item danger', onClick:()=>deleteQuote(q.id)}, '🗑️ حذف'),
                        )
                      )
                    )
                  ),
                )
              )
            )
          )
        )
    ),
    previewQuote && React.createElement(QuotePreview, {quote:previewQuote, onClose:()=>setPreviewQuote(null)}),
    showDropdown && React.createElement('div', {style:{position:'fixed',inset:0,zIndex:150}, onClick:()=>setShowDropdown(null)}),
  );
}

// ========================
// MAIN APP
// ========================
function App() {
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [quotations, setQuotations] = useState(INITIAL_QUOTATIONS);
  const [orders, setOrders] = useState(INITIAL_ORDERS);
  const [logs, setLogs] = useState(INITIAL_LOGS);
  const [toasts, setToasts] = useState([]);
  const [mobileOpen, setMobileOpen] = useState(false);

  const addToast = useCallback((msg, type='info') => {
    const id = Date.now();
    setToasts(p => [...p, {id, msg, type}]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3000);
  }, []);

  const addLog = useCallback((u, action, target) => {
    setLogs(p => [...p, {id:Date.now(), userId:u.id, userName:u.name, action, target, createdAt:now()}]);
  }, []);

  const logout = () => { setUser(null); setPage('dashboard'); };

  if (!user) return React.createElement(AuthPage, {onLogin:setUser});

  const pageProps = {quotations, setQuotations, orders, setOrders, user, addLog, addToast, setPage, logs};

  const pages = {
    dashboard: React.createElement(Dashboard, pageProps),
    quotations: React.createElement(QuotationsList, pageProps),
    'new-quotation': React.createElement(NewQuotation, pageProps),
    orders: React.createElement(OrdersPage, pageProps),
    archive: React.createElement(ArchivePage, pageProps),
    users: user.role==='admin' ? React.createElement(UsersPage, {user, addToast}) : null,
    activity: user.role==='admin' ? React.createElement(ActivityPage, {logs}) : null,
  };

  return React.createElement('div', {className:'app-layout'},
    React.createElement(Sidebar, {currentPage:page, setPage, user, onLogout:logout}),
    mobileOpen && React.createElement('div', {style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:99}, onClick:()=>setMobileOpen(false)}),
    React.createElement('div', {className:'main-content'},
      React.createElement(Topbar, {page, user, notifCount:1, onToggleMobile:()=>setMobileOpen(p=>!p)}),
      React.createElement('div', {className:'page-content'},
        pages[page] || React.createElement('div', {className:'empty-state'},
          React.createElement('div', {className:'empty-icon'}, '🔒'),
          React.createElement('div', {className:'empty-title'}, 'غير مصرح بالوصول'),
        )
      )
    ),
    React.createElement(ToastContainer, {toasts}),
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
